<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Castle Crafty · Dwarf-hewn Stone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to the price list</a>
<header class="hero">
  <div class="band" aria-hidden="true"></div>
  <svg class="tower" viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
    <polygon points="60,4 76,22 76,116 44,116 44,22" fill="#0c0d10" stroke="#d9a93c" stroke-width="2"/>
    <polygon points="44,22 30,10 38,40 44,40" fill="#0c0d10" stroke="#d9a93c" stroke-width="2"/>
    <polygon points="76,22 90,10 82,40 76,40" fill="#0c0d10" stroke="#d9a93c" stroke-width="2"/>
    <polygon points="60,40 66,52 60,64 54,52" fill="#f3c65a"/>
    <path d="M52 84l8-8 8 8M52 98l8-8 8 8" fill="none" stroke="#d9a93c" stroke-width="2"/>
  </svg>
  <p class="kicker">The Shop at Orthanc</p>
  <h1 id="shopname">Castle Crafty</h1>
  <p class="lede">Wrought in black stone, priced in diamonds.</p>
  <div class="band" aria-hidden="true"></div>
</header>
<main id="main">
  <div id="status" class="status" role="status">Kindling the lanterns…</div>
  <div id="content" hidden>
    <section aria-labelledby="h-prices">
      <h2 class="lintel" id="h-prices"><span>Price list</span></h2>
      <ul class="grid" id="products"></ul>
    </section>
    <section aria-labelledby="h-books">
      <h2 class="lintel" id="h-books"><span>Enchanted books</span></h2>
      <p class="price-line" id="bookprice"></p>
      <ul class="books" id="books"></ul>
    </section>
    <section aria-labelledby="h-req">
      <h2 class="lintel" id="h-req"><span>Special requests</span></h2>
      <div class="slab" id="req"></div>
    </section>
    <section aria-labelledby="h-casino">
      <h2 class="lintel" id="h-casino"><span>The casino</span></h2>
      <div class="slab" id="casino"></div>
    </section>
  </div>
</main>
<footer><div class="band" aria-hidden="true"></div><p>Castle Crafty · a draft in dwarf-hewn stone</p></footer>
<script src="app.js"></script>
</body>
</html>
