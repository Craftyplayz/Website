<!DOCTYPE html>
<html>
<head>
    <title>Right-Click Example</title>
    <script>
        function openPage() {
            window.location.href = "https://example.com"; // Replace with the URL of the page you want to open
        }
    </script>
    
</head>
<body oncontextmenu="openPage()">
    <h1>Right-Click to Open a Different Page</h1>
</body>
</html>
