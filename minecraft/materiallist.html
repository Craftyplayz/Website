<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Litematica → Sheets</title>
<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1200px;
    margin: 20px auto;
    padding: 20px;
}

textarea {
    width: 100%;
    height: 300px;
    font-family: monospace;
}

button {
    padding: 10px 20px;
    margin: 10px 0;
    cursor: pointer;
}

table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
}

th {
    background: #eee;
}
</style>
</head>
<body>

<h2>Litematica Material List → Google Sheets</h2>

<textarea id="input" placeholder="Paste material list here"></textarea>
<br>
<button onclick="convert()">Convert</button>
<button onclick="copyTSV()">Copy for Sheets</button>

<textarea id="output" readonly></textarea>

<table id="preview">
    <thead>
        <tr>
            <th>Item</th>
            <th>Total</th>
            <th>Missing</th>
            <th>Available</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
let sheetData = [];

function convert() {
    const text = document.getElementById("input").value;
    const lines = text.split("\n");

    sheetData = [];
    const tbody = document.querySelector("#preview tbody");
    tbody.innerHTML = "";

    for (const line of lines) {

        if (
            !line.includes("|") ||
            line.includes("Material List for schematic") ||
            line.includes("+---")
        ) continue;

        const parts = line
            .split("|")
            .map(x => x.trim())
            .filter(x => x.length);

        if (parts.length !== 4) continue;
        if (parts[0] === "Item") continue;

        const row = [
            parts[0],
            parts[1],
            parts[2],
            parts[3]
        ];

        sheetData.push(row);

        const tr = document.createElement("tr");
        row.forEach(value => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    }

    const tsv = [
        ["Item","Total","Missing","Available"],
        ...sheetData
    ]
    .map(r => r.join("\t"))
    .join("\n");

    document.getElementById("output").value = tsv;
}

function copyTSV() {
    navigator.clipboard.writeText(
        document.getElementById("output").value
    );
    alert("Copied! Paste directly into Google Sheets.");
}
</script>

</body>
</html>
