    <div class="title">
        <h1>Template</h1>

    <div class="folder-list">
        <div id="life-folders"></div>
        <script>
            site.json('/data/manifests/life.json').then(function (dirs) {
                var h = '';
                Object.keys(dirs).forEach(function (dir) {
                    h += '<details><summary>' + site.esc(dir) + '</summary>';
                    dirs[dir].forEach(function (file) {
                        h += '<a href="' + site.esc(dir + '/' + file) + '" target="_blank">' + site.esc(file) + '</a>';
                    });
                    h += '</details>';
                });
                document.getElementById('life-folders').innerHTML = h;
            });
        </script>
    </div>
