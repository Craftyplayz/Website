<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frame Extractor</title>
    <style>
        /* local tool, same tokens as the site's global.css */
        :root {
            color-scheme: dark;
            --bg: #202020; --card: #2a2a2a; --card2: #323232; --sunken: #1b1b1b; --line: #3d3d3d; --line-strong: #555;
            --text: #ececec; --muted: #9b9b9b; --accent: #66c0f4; --btn: #2a6e9e; --btn-line: #4a9ad0; --btn-hover: #327bb0;
            --btn2: #3a3a3a; --btn2-hover: #474747; --danger-bg: #4a2424; --danger-line: #8a3a3a; --ok-bg: #2d4a24; --ok-line: #4f8a3a;
            --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.5; }
        main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
        h1 { margin: 0 0 4px; font-size: clamp(24px, 4vw, 34px); line-height: 1.2; }
        .lede { margin: 0 0 20px; color: var(--muted); }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: start; }
        label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
        label small { font-size: 12px; }
        .field { padding: 8px 12px; background: #161616; border: 1px solid #4a4a4a; border-radius: 8px; color: var(--text); font: inherit; font-size: 14px; min-width: 0; }
        .field:focus { outline: none; border-color: var(--accent); }
        .field[aria-invalid="true"] { border-color: var(--danger-line); }
        .btn { padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--btn2); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
        .btn:hover { background: var(--btn2-hover); }
        .btn.primary { background: var(--btn); border-color: var(--btn-line); }
        .btn.primary:hover { background: var(--btn-hover); }
        .btn:disabled { opacity: .5; cursor: default; }
        .btn.small { padding: 4px 10px; font-size: 13px; }
        .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .drop { display: grid; place-items: center; gap: 8px; padding: 28px 16px; border: 2px dashed var(--line-strong); border-radius: 12px; color: var(--muted); text-align: center; margin-bottom: 16px; }
        .drop.over { border-color: var(--accent); background: var(--sunken); }
        .total { font-size: 14px; color: var(--muted); }
        .total b { color: var(--text); font-size: 20px; }
        .list { display: grid; gap: 6px; margin-bottom: 16px; }
        .row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
        .row .name { display: grid; gap: 2px; min-width: 0; }
        .row .name small { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .row .meta { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
        .row .status { font-size: 13px; min-width: 120px; text-align: right; }
        .row .status.ok { color: #8fd18f; }
        .row .status.bad { color: #f0a0a0; white-space: normal; }
        .row .bar { grid-column: 1 / -1; height: 4px; background: var(--btn2); border-radius: 2px; overflow: hidden; }
        .row .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--btn), var(--accent)); }
        .dock { position: sticky; bottom: 0; display: grid; gap: 10px; padding: 12px 0 16px; background: rgb(32 32 32 / .96); border-top: 1px solid var(--line); }
        .overall { display: grid; gap: 6px; }
        .overall-bar { height: 10px; background: var(--btn2); border-radius: 5px; overflow: hidden; }
        .overall-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--btn), var(--accent)); transition: width .2s; }
        .close { background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 6px; border-radius: 4px; }
        .close:hover { color: var(--text); background: var(--btn2); }
        .err { padding: 10px 14px; border-radius: 8px; background: var(--danger-bg); border: 1px solid var(--danger-line); font-size: 14px; }
        [hidden] { display: none !important; }
        @media (max-width: 600px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .status { text-align: left; } }
    </style>
</head>

<body>
    <main>
        <h1>Frame Extractor</h1>
        <p class="lede">Turns videos into still frames for the episode guessing game.</p>

        <section class="card">
            <div class="cols">
                <label>One frame every (seconds) <input class="field" id="interval" type="number" inputmode="decimal" min="0.5" step="0.5" value="10"></label>
                <label>Cut from start <input class="field" id="start" value="0:00"><small>Skips the intro. 90 or 1:30</small></label>
                <label>Cut from end <input class="field" id="end" value="0:00"><small>Skips the credits. 90 or 1:30</small></label>
            </div>
        </section>

        <form class="card" id="pathform">
            <label>Folder or video on this PC
                <input class="field" id="path" placeholder="E:\media\tv\Game of Thrones" spellcheck="false">
                <small>Fastest: videos are read where they are, nothing is copied. In Explorer, Shift + right-click a folder › Copy as path.</small>
            </label>
            <div class="actions" style="margin-top:10px"><button class="btn">Add</button><span class="total" id="pathmsg" role="status"></span></div>
        </form>

        <div class="drop" id="drop">
            <span>Or drop video files or folders here (each video is copied while its frames are taken)</span>
            <div class="actions">
                <label class="btn small" style="display:inline-block;color:var(--text)">Choose videos <input id="files" type="file" accept="video/*,.mkv,.avi,.m4v" multiple hidden></label>
                <label class="btn small" style="display:inline-block;color:var(--text)">Choose folder <input id="folder" type="file" webkitdirectory multiple hidden></label>
            </div>
            <small>Videos from a folder keep their folders: Z:\web\videoframegame\Game of Thrones\Season 1\Episode 5\</small>
        </div>
        <p class="total" id="skipped" hidden></p>

        <div class="list" id="list"></div>

        <!-- stays at the bottom of the window, so total progress shows however long the list gets -->
        <div class="dock">
            <div class="overall" id="overall" hidden>
                <div class="overall-bar" role="progressbar" aria-label="Total progress" aria-valuemin="0" aria-valuemax="100"><i></i></div>
                <span class="total" id="eta" role="status"></span>
            </div>
            <div class="actions">
                <span class="total" id="total"></span>
                <span style="flex:1"></span>
                <button class="btn" id="open" type="button">Open output folder</button>
                <button class="btn primary" id="go" type="button" disabled>Extract frames</button>
            </div>
            <p class="err" id="err" hidden></p>
        </div>
    </main>

    <script>
        (() => {
            const $ = id => document.getElementById(id);
            // { file, folder, name, duration, id (once copied to the tool), state: probing|ready|copying|extracting|done|error, row }
            const items = [];
            let probing = Promise.resolve();
            const PROBE_BYTES = 8 * 1024 * 1024;

            // "Game.of.Thrones.S01E05.The.Wolf...mkv" -> "Episode 5"; other names keep the file name
            const episodeName = n => { const m = n.match(/S\d{1,2}\s*E(\d{1,3})/i); return m ? 'Episode ' + +m[1] : n.replace(/\.[^.]+$/, ''); };

            // "90", "1:30" or "1:02:03" -> seconds, NaN when it isn't a time
            function secs(v) {
                v = String(v).trim();
                if (!/^\d+(\.\d+)?$|^\d+(:\d{1,2}){1,2}$/.test(v)) return NaN;
                return v.split(':').reduce((a, p) => a * 60 + +p, 0);
            }
            const clock = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(r).padStart(2, '0'); };

            function settings() {
                const interval = +$('interval').value, start = secs($('start').value), end = secs($('end').value);
                $('interval').setAttribute('aria-invalid', !(interval > 0));
                $('start').setAttribute('aria-invalid', isNaN(start));
                $('end').setAttribute('aria-invalid', isNaN(end));
                return interval > 0 && !isNaN(start) && !isNaN(end) ? { interval, start, end } : null;
            }
            // same as times() in server.js
            const count = (d, s) => { const len = d - s.start - s.end; return len > 0 ? Math.ceil(len / s.interval) : 0; };

            function render() {
                const s = settings();
                let frames = 0;
                for (const it of items) {
                    const n = it.duration && s ? count(it.duration, s) : null;
                    if (n !== null) frames += n;
                    it.row.querySelector('.meta').textContent = it.duration ? clock(it.duration) + ' · ' + (n === null ? '?' : n.toLocaleString() + ' frames') : '';
                }
                $('total').innerHTML = items.length ? `<b>${frames.toLocaleString()}</b> frames from ${items.length} video${items.length > 1 ? 's' : ''}` : '';
                $('go').disabled = !s || !items.some(it => it.state === 'ready' && (!it.duration || count(it.duration, s) > 0));
                const unknown = items.filter(it => it.state === 'ready' && !it.duration).length;
                if (unknown) $('total').innerHTML += ` · ${unknown} not counted yet (length found when copied)`;
            }

            function status(it, text, cls, pct) {
                const st = it.row.querySelector('.status');
                st.textContent = text;
                st.className = 'status ' + (cls || '');
                it.row.querySelector('.bar').hidden = pct === undefined;
                if (pct !== undefined) it.row.querySelector('.bar i').style.width = pct + '%';
            }

            // length from the first 8 MB only, so adding a whole show doesn't copy it
            async function probe(it) {
                status(it, 'Reading...');
                try {
                    const r = await (await fetch('/probe?name=' + encodeURIComponent(it.file.name), { method: 'POST', body: it.file.slice(0, PROBE_BYTES) })).json();
                    if (r.error) throw new Error(r.error);
                    it.duration = r.duration;
                    it.state = 'ready';
                    status(it, 'Ready');
                } catch (e) {
                    it.state = 'error';
                    status(it, e instanceof TypeError ? 'Reading failed. Is the tool still running?' : e.message, 'bad');
                }
                render();
            }

            // the whole video goes to the tool just before its frames are taken, then the tool deletes its copy
            function upload(it) {
                return new Promise(resolve => {
                    const x = new XMLHttpRequest();
                    x.open('POST', '/upload?name=' + encodeURIComponent(it.file.name));
                    x.upload.onprogress = e => status(it, 'Copying ' + Math.floor(e.loaded / e.total * 100) + '%', '', e.loaded / e.total * 100);
                    x.onload = () => {
                        const r = JSON.parse(x.responseText || '{}');
                        if (r.error) { it.state = 'error'; status(it, r.error, 'bad'); return resolve(false); }
                        Object.assign(it, { id: r.id, duration: r.duration });
                        render();
                        resolve(true);
                    };
                    x.onerror = () => { it.state = 'ready'; status(it, 'Copying failed. Is the tool still running?', 'bad'); resolve(false); };
                    it.state = 'copying';
                    status(it, 'Copying 0%', '', 0);
                    x.send(it.file);
                });
            }

            const VIDEO = /\.(mp4|mkv|avi|mov|m4v|webm|wmv|flv|ts|m2ts|mpg|mpeg|3gp)$/i;

            // entries: [File (or {name}), folder path relative to what was picked ('' for loose files), known?]
            // known = { id, duration } for videos the tool reads from disk itself; anything not a video is skipped
            function add(entries) {
                // in folder and episode order (Season 2 after Season 1, E10 after E9), whatever order the browser lists them
                const key = ([f, folder]) => folder + '/' + f.name;
                const videos = entries.filter(([f]) => VIDEO.test(f.name)).sort((a, b) => key(a).localeCompare(key(b), undefined, { numeric: true }));
                const skipped = entries.length - videos.length;
                $('skipped').hidden = !skipped;
                $('skipped').textContent = `Skipped ${skipped} file${skipped === 1 ? '' : 's'} that ${skipped === 1 ? "isn't a video" : "aren't videos"}.`;
                for (const [file, folder, known] of videos) {
                    const it = { file, folder, state: known ? 'ready' : 'probing', ...known };
                    const row = document.createElement('div');
                    row.className = 'row';
                    row.innerHTML = '<div class="name"><small hidden></small><input class="field" aria-label="Episode name (folder name)" title="Episode name, used as the folder name"></div><span class="meta"></span><span class="status"></span><button class="close" type="button" aria-label="Remove" title="Remove">&times;</button><div class="bar" hidden><i></i></div>';
                    const where = row.querySelector('small');
                    where.hidden = !folder;
                    where.textContent = folder.replaceAll('/', ' › ');
                    where.title = folder;
                    const input = row.querySelector('input');
                    input.value = episodeName(file.name);
                    input.title = file.name;
                    input.addEventListener('input', () => it.name = input.value);
                    it.name = input.value;
                    row.querySelector('.close').addEventListener('click', () => { if (it.state === 'copying' || it.state === 'extracting') return; items.splice(items.indexOf(it), 1); row.remove(); render(); });
                    it.row = row;
                    items.push(it);
                    $('list').append(row);
                    if (known) status(it, 'Ready');
                    else probing = probing.then(() => items.includes(it) ? probe(it) : null);
                }
                render();
            }

            $('pathform').addEventListener('submit', async e => {
                e.preventDefault();
                const p = $('path').value.trim().replace(/^"|"$/g, ''); // "Copy as path" adds quotes
                if (!p) return;
                const btn = e.submitter || $('pathform').querySelector('button');
                btn.disabled = true;
                $('pathmsg').textContent = 'Reading the folder...';
                try {
                    const r = await (await fetch('/scan', { method: 'POST', body: JSON.stringify({ path: p }) })).json();
                    if (r.error) throw new Error(r.error);
                    add([...r.videos.map(v => [{ name: v.file }, v.folder, { id: v.id, duration: v.duration }]), ...r.others.map(n => [{ name: n }, ''])]);
                    $('pathmsg').textContent = r.videos.length ? `Added ${r.videos.length} video${r.videos.length > 1 ? 's' : ''}.` : 'No videos found there.';
                    $('path').value = '';
                } catch (x) {
                    $('pathmsg').textContent = x instanceof TypeError ? 'Is the tool still running?' : x.message;
                }
                btn.disabled = false;
            });

            async function extract(it, s) {
                if (!it.id && !await upload(it)) return;
                if (!count(it.duration, s)) { it.state = 'ready'; status(it, 'No frames with these cut times', 'bad'); return; }
                it.state = 'extracting';
                status(it, 'Starting...', '', 0);
                try {
                    const r = await fetch('/extract', { method: 'POST', body: JSON.stringify({ id: it.id, name: it.name, folder: it.folder, ...s }) });
                    if (!r.ok) throw new Error((await r.json()).error);
                    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
                    let buf = '', last = {};
                    for (;;) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        buf += value;
                        const lines = buf.split('\n');
                        buf = lines.pop();
                        for (const l of lines) {
                            last = JSON.parse(l);
                            if (last.total) {
                                status(it, last.done + ' / ' + last.total, '', last.done / last.total * 100);
                                it.done = last.done;
                                overall();
                            }
                        }
                    }
                    if (buf.trim()) last = JSON.parse(buf);
                    if (last.error) throw new Error(last.error);
                    it.state = 'done';
                    status(it, 'Done', 'ok');
                    it.row.querySelector('input').disabled = true;
                } catch (e) {
                    it.state = 'ready';
                    status(it, e.message || 'Extraction failed', 'bad');
                }
            }

            // total progress for the current run; the time left uses only the last ~5 seconds of speed
            let run = null; // { items, s, samples: [[ms, framesDone]], t0 }
            const dur = sec => { sec = Math.round(sec); return sec < 60 ? sec + ' s' : sec < 3600 ? Math.round(sec / 60) + ' min' : Math.floor(sec / 3600) + ' h ' + Math.round(sec % 3600 / 60) + ' min'; };

            function overall() {
                if (!run) return;
                let done = 0, total = 0;
                for (const it of run.items) {
                    const n = it.duration ? count(it.duration, run.s) : 0;
                    total += n;
                    done += it.state === 'done' ? n : Math.min(it.done || 0, n);
                }
                const now = performance.now();
                run.samples.push([now, done]);
                while (run.samples.length > 2 && now - run.samples[1][0] >= 5000) run.samples.shift();
                const [t0, d0] = run.samples[0];
                const rate = (done - d0) / ((now - t0) / 1000);
                const pct = total ? done / total * 100 : 0;
                $('overall').querySelector('i').style.width = pct + '%';
                $('overall').firstElementChild.setAttribute('aria-valuenow', Math.round(pct));
                const left = !run.finished && rate > 0 && now - t0 > 1500 ? ' · about ' + dur((total - done) / rate) + ' left' : run.finished ? '' : ' · working out time left...';
                $('eta').textContent = `${done.toLocaleString()} / ${total.toLocaleString()} frames · ${Math.floor(pct)}%${left}` + (run.finished ? ' · finished in ' + dur((now - run.t0) / 1000) : '');
            }

            $('go').addEventListener('click', async () => {
                const s = settings();
                if (!s) return;
                const names = items.filter(it => it.state === 'ready').map(it => (it.folder + '/' + it.name.trim()).toLowerCase());
                if (new Set(names).size !== names.length) { $('err').textContent = 'Two videos in the same folder have the same name. Rename one so their frames go to different folders.'; $('err').hidden = false; return; }
                $('err').hidden = true;
                $('go').disabled = true;
                $('go').textContent = 'Extracting...';
                // 3 videos at a time keeps the tool's ffmpeg pool busy while one video starts or finishes
                const todo = items.filter(it => it.state === 'ready' && (!it.duration || count(it.duration, s) > 0));
                for (const it of todo) it.done = 0;
                run = { items: [...todo], s, samples: [], t0: performance.now() };
                $('overall').hidden = false;
                overall();
                const tick = setInterval(overall, 1000); // keeps the time left moving between frames
                await Promise.all(Array.from({ length: 3 }, async () => { while (todo.length) await extract(todo.shift(), s); }));
                clearInterval(tick);
                run.finished = true;
                overall();
                $('go').textContent = 'Extract frames';
                render();
            });

            $('open').addEventListener('click', () => fetch('/open', { method: 'POST' }));
            $('files').addEventListener('change', e => { add([...e.target.files].map(f => [f, ''])); e.target.value = ''; });
            // a picked folder gives "Season 1/S01E01.mkv"; keep the folder part, including the picked folder itself
            $('folder').addEventListener('change', e => { add([...e.target.files].map(f => [f, f.webkitRelativePath.split('/').slice(0, -1).join('/')])); e.target.value = ''; });
            for (const id of ['interval', 'start', 'end']) $(id).addEventListener('input', render);

            // dropped folders are walked recursively; readEntries returns at most 100 entries per call
            async function walk(entry, out) {
                if (entry.isFile) return out.push([await new Promise((ok, no) => entry.file(ok, no)), entry.fullPath.split('/').slice(1, -1).join('/')]);
                const reader = entry.createReader();
                for (let batch; (batch = await new Promise((ok, no) => reader.readEntries(ok, no))).length;)
                    for (const e of batch) await walk(e, out);
            }

            const drop = $('drop');
            drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
            drop.addEventListener('dragleave', () => drop.classList.remove('over'));
            drop.addEventListener('drop', async e => {
                e.preventDefault();
                drop.classList.remove('over');
                const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry()).filter(Boolean);
                const out = [];
                for (const entry of entries) await walk(entry, out);
                add(out);
            });
        })();
    </script>
</body>

</html>
