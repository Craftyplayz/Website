    <script>
        var profileIds = [
            '22159541fde841e6a104593e1cb3a456',
            '39ac5666450b4635873573217a72f143',
            'dd5b7e595e7846a983d11f9cafa0cd42'
        ];
        // converts a base64 skin payload to an image tag for a minecraft head
        function headUrl(b64) {
            var skin = JSON.parse(atob(b64)).textures.SKIN.url.split('/')[4];
            return '<img src="https://www.mc-heads.net/head/' + encodeURIComponent(skin) + '/left">';
        }

        site.json('/data/hypixel/members.json').then(function (d) {
            var h = '';
            profileIds.forEach(function (id) {
                (d.members[id] || []).forEach(function (p) {
                    if (p.cute_name !== 'Mango') return;
                    p.crafted_generators.forEach(function (g) {
                        h += site.esc(g) + '<br>';
                        try { h += headUrl(g); } catch (e) { }
                    });
                });
            });
            document.getElementById('minions').innerHTML = h;
        });
    </script>
