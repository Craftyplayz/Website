    <div id="ghast"></div>

    <script>
        var fmt = function (n, d) { return n.toLocaleString('en-US', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); };

        Promise.all([site.json('/data/hypixel/coin-purse.json'), site.json('/data/hypixel/bazaar.json')]).then(function (res) {
            var coinpurse = res[0].coin_purse || 0;
            var price = res[1].ENCHANTED_GHAST_TEAR.pricePerUnit || 0;
            var usable = Math.max(0, coinpurse - 1000000);
            var maxItems = price > 0 ? Math.floor(usable / price) : 0;
            var maxPerOrder = 71680, revenuePerItem = 1163.125;
            var ordered = 0, profit = 0, orders = '';
            while (maxItems > 0) {
                var n = Math.min(maxItems, maxPerOrder);
                orders += '<p>Items to order: ' + n + '</p>';
                ordered += n;
                maxItems -= n;
                profit += (revenuePerItem - price) * n;
            }
            document.getElementById('ghast').innerHTML =
                '<h1>Ghast Tear Bazaar Calculation</h1>' +
                '<h2>Balance</h2><div class="info"><p>Current Coin Purse: ' + fmt(coinpurse) + '</p></div>' +
                '<h2>Price Per Unit</h2><div class="info"><p>Price per unit: ' + fmt(price, 2) + '</p></div>' +
                '<h2>Order Summary</h2><div class="orders">' + orders + '</div>' +
                '<h2>Total Items Ordered</h2><div class="info"><p>Total Items Ordered: ' + ordered + '</p></div>' +
                '<h2>Estimated Total Profit</h2><div class="info"><p>Estimated Total Profit: ' + fmt(profit, 2) + '</p></div>';
        }).catch(function () {
            document.getElementById('ghast').innerHTML = '<p>Failed to retrieve data.</p>';
        });
    </script>
