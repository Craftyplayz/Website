    <div class="title">

    <script>
        var isHovered = false;

        function startTimer(duration, display) {
            var timer = duration, minutes, seconds;
            setInterval(function () {
                if (!isHovered) { // Only update the display when not hovered
                    minutes = parseInt(timer / 60, 10);
                    seconds = parseInt(timer % 60, 10);
                    minutes = minutes < 10 ? "0" + minutes : minutes;
                    seconds = seconds < 10 ? "0" + seconds : seconds;
                    display.textContent = minutes.substr(-1) + ":" + seconds;
                    if (--timer < 0) {
                        timer = duration;
                    }
                }
            }, 1000);
        }

        function showBackText() {
            isHovered = true;
            document.querySelector('#timer').textContent = 'THIS IS WAR';
        }

        function hideBackText() {
            isHovered = false;
        }

        window.onload = function () {
            startTimer(60, document.querySelector('#timer'));
        };

        // profile 2215... = Mango (Crafty), profile facc... = Papaya (Waffle)
        var CRAFTY = '22159541fde841e6a104593e1cb3a456', WAFFLE = 'faccdbb77a1f4ed6a5d442dca531089b';

        site.json('/data/hypixel/members.json').then(function (d) {
            function melons(id, name) {
                var p = (d.members[id] || []).filter(function (x) { return x.cute_name === name; })[0];
                return p ? (p.collection.MELON || 0) : 0;
            }
            function line(id, headId, name) {
                return '<img style="height: 30px;" src="https://www.mc-heads.net/head/' + headId + '/left"> ' +
                    site.shortenNumber(melons(id, name)) + (d.status[id] === 'garden' ? ' Currently In Garden<br>' : '<br>');
            }
            var crafty = parseFloat(String(site.shortenNumber(melons(CRAFTY, 'Mango'))));
            var waffle = parseFloat(String(site.shortenNumber(melons(WAFFLE, 'Papaya'))));
            document.getElementById('war').innerHTML =
                line(CRAFTY, '22159541-fde8-41e6-a104-593e1cb3a456', 'Mango') +
                line(WAFFLE, WAFFLE, 'Papaya') +
                'Crafty has ' + (crafty - waffle) + ' Million more melons than Waffle<br>';
        });
    </script>
