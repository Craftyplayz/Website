    <div id="retro"></div>

    <script>
        var esc = site.esc;
        var BEATEN = ['beaten-softcore', 'beaten-hardcore'];

        function daysAgo(ts) {
            var diff = Math.round((Date.now() - ts) / 86400000);
            return diff + (diff === 1 ? ' day ago' : ' days ago');
        }

        function renderGame(game) {
            var done = game.NumAwarded, total = game.MaxPossible;
            var pct = total > 0 ? Math.round(done / total * 100) : 0;
            var beaten = BEATEN.indexOf(game.HighestAwardKind) !== -1;
            var date = beaten ? game.HighestAwardDate : game.MostRecentAwardedDate;
            var label = beaten ? 'Beaten Date' : 'Last Achievement Awarded';
            var ts = Date.parse(date);
            var exact = date ? new Date(ts).toLocaleString('en-GB', { dateStyle: 'long', timeStyle: 'short' }) : 'N/A';
            var link = '/retro/game?game=' + game.GameID;
            return '<div class="games">\n' +
                '  <a href="' + link + '"><img class="banner" src="https://retroachievements.org' + esc(game.ImageIcon) + '" style="width: 160px; height: 160px; object-fit: cover;"></a>\n' +
                '  <a href="' + link + '" style="width: 50%; color: white"><p class="gamename">' + esc(game.Title) + '</p></a>\n' +
                '  <div class="info">\n' +
                '    <div class="item"><p>Console</p><p>' + esc(game.ConsoleName) + '</p></div>\n' +
                '    <div class="item"><p>' + label + '</p><p title="' + esc(exact) + '">' + daysAgo(ts) + '</p></div>\n' +
                '    <div class="item"><p>Achievements ' + done + '/' + total + ' (' + pct + '%)</p><progress value="' + pct + '" max="100"></progress></div>\n' +
                '  </div>\n</div>\n';
        }

        // Data comes from /data/retro.json (written by scripts/fetch-data.js)
        site.json('/data/retro.json').then(function (d) {
            var highlighted = [], regular = [];
            d.results.forEach(function (g) { (BEATEN.indexOf(g.HighestAwardKind) !== -1 ? highlighted : regular).push(g); });
            var h = '';
            if (d.lastGame) {
                h += '<div class="title"><h2>Last Played</h2></div>\n<div class="last-played">\n' + renderGame(d.lastGame) +
                    '  <p>Rich Presence: ' + esc(d.richPresence) + '</p>\n</div>\n';
            }
            if (highlighted.length) h += '<div class="title"><h2>Completed Games</h2></div>\n' + highlighted.map(renderGame).join('');
            if (regular.length) h += '<div class="title"><h2>In Progress Games</h2></div>\n' + regular.map(renderGame).join('');
            document.getElementById('retro').innerHTML = h;
        });
    </script>
