    <div class="info" id="gameinfo"></div>

    <script>
        var esc = site.esc;
        var game = new URLSearchParams(location.search).get('game') || '';
        // Only digits are valid app ids; anything else is rejected
        if (/^\d+$/.test(game)) {
            site.json('/data/steam/games/' + game + '.json').then(function (d) {
                var i = d.info;
                if (i) {
                    document.title = i.name + ' Stats';
                    var h = '';
                    var site_ = /^https?:\/\//i.test(i.website || '') ? i.website : '';
                    h += '<a href="' + esc(site_) + '"><h1>' + esc(i.name) + '</h1></a>';
                    h += '<h2>' + esc(site.decode(i.short_description)) + '</h2>';
                    h += '<h3>Release Date: ' + esc(i.release_date && i.release_date.date) + '</h3>';
                    h += '<h3>Price: £' + (i.price != null ? i.price / 100 : '') + '</h3>';
                    if (i.metacritic) {
                        var mu = /^https?:\/\//i.test(i.metacritic.url || '') ? i.metacritic.url : '';
                        h += '<h3>Metacritic Score: ' + esc(i.metacritic.score) + '%</h3>';
                        h += '<h3>Metacritic Link: <a href="' + esc(mu) + '">' + esc(mu) + '</a></h3>';
                    }
                    h += '<h3>Steam Link: <a href="https://store.steampowered.com/app/' + game + '">' + esc(i.name) + '</a></h3>';
                    document.getElementById('gameinfo').innerHTML = h;
                }
                var rows = '';
                (d.achievements || []).forEach(function (a) {
                    rows += '<tr><td>' + esc(a.name) + '</td>';
                    if (a.achieved === 1) {
                        var t = Math.floor(Date.now() / 1000) - a.unlocktime;
                        var days = Math.floor(t / 86400), hours = Math.floor((t % 86400) / 3600);
                        rows += '<td style="color: green;">Achieved</td><td>' + esc(a.description) + '</td><td>' +
                            (days > 0 ? days + ' days ' : '') + (hours > 0 ? hours + ' hours ' : '') + 'ago</td>';
                    } else {
                        rows += '<td style="color: red;">Not Achieved</td><td>' + esc(a.description) + '</td><td></td>';
                    }
                    rows += '</tr>';
                });
                document.getElementById('achievements').innerHTML = rows;
            }).catch(function () { });
        }
    </script>
